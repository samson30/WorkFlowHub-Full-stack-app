name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/workflowhub-api

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore WorkFlowHub.slnx

      - name: Build
        run: dotnet build WorkFlowHub.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test tests/WorkFlowHub.UnitTests/WorkFlowHub.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage
        env:
          Jwt__Key: ${{ secrets.JWT_KEY || 'ci-test-key-minimum-32-characters-long-ok' }}

      - name: Run integration tests
        run: |
          dotnet test tests/WorkFlowHub.IntegrationTests/WorkFlowHub.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal
        env:
          Jwt__Key: ${{ secrets.JWT_KEY || 'ci-test-key-minimum-32-characters-long-ok' }}
          Jwt__Issuer: WorkFlowHub
          Jwt__Audience: WorkFlowHubUsers

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          directory: ./coverage
          fail_ci_if_error: false

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/WorkFlowHub.API/Dockerfile
          push: false
          tags: workflowhub-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: workflowhub-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/WorkFlowHub.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
