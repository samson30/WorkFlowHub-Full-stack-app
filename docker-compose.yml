services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: workflowhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${SA_PASSWORD} -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s
    networks:
      - workflowhub-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/WorkFlowHub.API/Dockerfile
      network: host
    container_name: workflowhub-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=WorkFlowHub;
        User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: WorkFlowHub
      Jwt__Audience: WorkFlowHubUsers
      Jwt__ExpiryHours: "24"
      Azure__BlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tiqRIk==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Cors__AllowedOrigins__0: http://localhost:3000
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
    networks:
      - workflowhub-net
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: workflowhub-azurite
    command: azurite-blob --blobHost 0.0.0.0
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    networks:
      - workflowhub-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: workflowhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - workflowhub-net
    restart: unless-stopped

volumes:
  sqlserver-data:
  azurite-data:

networks:
  workflowhub-net:
    driver: bridge
